# Host shortcuts work regardless of the machine selected inside Herdr.
map f8 launch --type=tab --tab-title=qmtui --title=qmtui-local qmtui-local
map f9 launch --type=overlay --title=qmtui-local qmtui-local

# Close only the viewer, leaving the player running on Local.
map --when-focus-on title:^qmtui-local$ f8 send_key ctrl+b q
map --when-focus-on title:^qmtui-local$ f9 send_key ctrl+b q
