id = "qmtui"
name = "qmtui Music"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Toggle a persistent QQ Music player without interrupting playback"
platforms = ["linux", "macos"]

[[actions]]
id = "toggle"
title = "Show / hide qmtui"
contexts = ["workspace"]
command = ["python3", "qmtui.py", "toggle"]

[[panes]]
id = "player"
title = "qmtui"
placement = "tab"
command = ["python3", "qmtui.py", "run"]
