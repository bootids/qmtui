name: Linux tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify Herdr plugin behavior
        run: python3 -m unittest discover -s plugins/herdr -p 'test_*.py' -v
      - run: dotnet test tests/QmTui.Tests/QmTui.Tests.csproj -c Release
